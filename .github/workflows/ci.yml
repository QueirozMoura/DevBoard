name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: devboard
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: devboard_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U devboard -d devboard_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://devboard:ci-only-password@localhost:5433/devboard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run openapi:validate
      - run: npm run db:migrate:test
      - run: npm test
      - run: npm run build
      - run: npm run check:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
